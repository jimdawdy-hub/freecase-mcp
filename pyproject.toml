[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freecase-mcp"
version = "0.2.0"
description = "MCP connector for searching the Freecase legal corpus (case law + statutes) from AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Freecase" }]
keywords = ["mcp", "legal", "case-law", "statutes", "freecase", "llm", "agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Legal Industry",
]
dependencies = [
    "mcp>=1.9,<2",
    "httpx>=0.27",
    "pydantic>=2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
freecase-mcp = "freecase_mcp.server:main"

[project.urls]
Homepage = "https://freecase.ai"
Documentation = "https://freecase.ai"

[tool.hatch.build.targets.wheel]
packages = ["src/freecase_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
